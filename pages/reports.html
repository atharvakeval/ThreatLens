<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreatLens — Reports</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.report-metric{background:var(--bg2);border-radius:10px;padding:14px;border:1px solid var(--border);text-align:center}
.report-num{font-size:28px;font-weight:500;margin:4px 0}
.report-lbl{font-size:11px;color:var(--text4);text-transform:uppercase;letter-spacing:.05em}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 0}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar{width:100%;border-radius:3px 3px 0 0;transition:height .4s,background .2s;cursor:pointer;min-width:8px}
.chart-bar:hover{filter:brightness(1.3)}
.chart-day{font-size:9px;color:var(--text4)}
.donut-container{display:flex;align-items:center;gap:20px;justify-content:center;padding:10px 0}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sla-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sla-name{font-size:12px;color:var(--text2);width:80px;flex-shrink:0}
.sla-bar-bg{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.sla-fill{height:100%;border-radius:4px;transition:width .5s}
.sla-pct{font-size:11px;color:var(--text3);width:36px;text-align:right;flex-shrink:0}
</style>
</head>
<body>
<div id="sidebar"></div>
<div class="main">
  <div id="topbar"></div>
  <div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <span style="font-size:16px;font-weight:500">Reports</span>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="filter-tabs" style="margin-bottom:0">
          <button class="ftab active" onclick="setRange('week',this)">This week</button>
          <button class="ftab" onclick="setRange('month',this)">This month</button>
          <button class="ftab" onclick="setRange('quarter',this)">Quarter</button>
        </div>
        <button class="btn btn-primary" onclick="exportReport()">Export PDF</button>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom:14px" id="summary-metrics"></div>

    <div class="grid-2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-title">Daily alert volume</div>
        <div class="chart-bars" id="volume-chart"></div>
      </div>
      <div class="card">
        <div class="card-title">Alert breakdown by type</div>
        <div class="donut-container">
          <svg width="110" height="110" viewBox="0 0 110 110" id="donut-svg"></svg>
          <div class="donut-legend" id="donut-legend"></div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Top attack vectors this period</div>
        <div id="report-bars"></div>
      </div>
      <div class="card">
        <div class="card-title">Team SLA compliance</div>
        <div id="sla-bars"></div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--text4)">Scheduled report</span>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <div id="toggle-track" onclick="toggleSchedule()" style="width:36px;height:20px;background:var(--border2);border-radius:10px;position:relative;cursor:pointer;transition:background .2s">
              <div id="toggle-thumb" style="position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s"></div>
            </div>
            <span style="font-size:11px;color:var(--text4)" id="toggle-label">Every Monday 9am</span>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/data.js"></script>
<script>
document.getElementById('sidebar').innerHTML = renderSidebar('Reports');
document.getElementById('topbar').innerHTML = renderTopbar('Reports');

const RANGES = {
  week:{days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],data:[42,68,55,91,74,38,61],total:429,resolved:381,open:48,avg:'4.2m'},
  month:{days:['W1','W2','W3','W4'],data:[310,428,390,501],total:1629,resolved:1410,open:219,avg:'5.8m'},
  quarter:{days:['Jan','Feb','Mar'],data:[1200,1580,1629],total:4409,resolved:3890,open:519,avg:'6.1m'},
};
let currentRange = 'week';

function setRange(r, btn){
  document.querySelectorAll('.filter-tabs .ftab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  currentRange = r;
  renderAll();
}

function renderAll(){
  const d = RANGES[currentRange];
  document.getElementById('summary-metrics').innerHTML = [
    {label:'Total incidents',num:d.total,color:'var(--text)'},
    {label:'Resolved',num:d.resolved,color:'var(--green)'},
    {label:'Open / Active',num:d.open,color:'var(--red)'},
    {label:'Avg response time',num:d.avg,color:'var(--amber)'},
    {label:'False positive rate',num:'12%',color:'var(--blue)'},
    {label:'SLA compliance',num:'94%',color:'var(--green)'},
  ].map(m=>`<div class="report-metric"><div class="report-lbl">${m.label}</div><div class="report-num" style="color:${m.color}">${m.num}</div></div>`).join('');

  const max = Math.max(...d.data);
  document.getElementById('volume-chart').innerHTML = d.days.map((day,i)=>{
    const h = Math.round((d.data[i]/max)*100);
    const c = d.data[i]===max?'#ef4444':d.data[i]>max*.7?'#f59e0b':'#1e3a5c';
    return `<div class="chart-bar-col">
      <div class="chart-bar" style="height:${h}px;background:${c}" title="${d.data[i]} alerts on ${day}"></div>
      <span class="chart-day">${day}</span>
    </div>`;
  }).join('');

  document.getElementById('report-bars').innerHTML = ATTACK_TYPES.map(a=>`
    <div class="bar-row">
      <span class="bar-label">${a.label}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(a.count/82*100)}%;background:${sevColor(a.severity)}"></div></div>
      <span class="bar-val">${a.count}</span>
    </div>`).join('');
  renderDonut();
}

function renderDonut(){
  const segments=[
    {label:'SQL Injection',val:28,color:'#ef4444'},
    {label:'Brute Force',val:23,color:'#f59e0b'},
    {label:'Phishing',val:19,color:'#60a5fa'},
    {label:'Port Scan',val:15,color:'#4ade80'},
    {label:'Other',val:15,color:'#6b7280'},
  ];
  const cx=55,cy=55,r=40,inner=24;
  let angle=-Math.PI/2;
  const total=segments.reduce((s,x)=>s+x.val,0);
  let paths='';
  segments.forEach(seg=>{
    const a=seg.val/total*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    const x2=cx+r*Math.cos(angle+a),y2=cy+r*Math.sin(angle+a);
    const ix1=cx+inner*Math.cos(angle),iy1=cy+inner*Math.sin(angle);
    const ix2=cx+inner*Math.cos(angle+a),iy2=cy+inner*Math.sin(angle+a);
    const large=a>Math.PI?1:0;
    paths+=`<path d="M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${ix2},${iy2} A${inner},${inner} 0 ${large},0 ${ix1},${iy1} Z" fill="${seg.color}" opacity=".85"/>`;
    angle+=a;
  });
  document.getElementById('donut-svg').innerHTML=paths;
  document.getElementById('donut-legend').innerHTML=segments.map(s=>`
    <div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${s.label} — ${s.val}%</div>`).join('');
}

const slaData=[
  {name:'Riya J.',pct:96,color:'#4ade80'},
  {name:'Aryan M.',pct:91,color:'#4ade80'},
  {name:'Priya S.',pct:88,color:'#f59e0b'},
  {name:'Dev K.',pct:94,color:'#4ade80'},
  {name:'Neha R.',pct:79,color:'#f59e0b'},
];
document.getElementById('sla-bars').innerHTML = slaData.map(s=>`
  <div class="sla-row">
    <span class="sla-name">${s.name}</span>
    <div class="sla-bar-bg"><div class="sla-fill" style="width:${s.pct}%;background:${s.color}"></div></div>
    <span class="sla-pct">${s.pct}%</span>
  </div>`).join('');

let scheduleOn = false;
function toggleSchedule(){
  scheduleOn = !scheduleOn;
  document.getElementById('toggle-track').style.background = scheduleOn?'#378ADD':'var(--border2)';
  document.getElementById('toggle-thumb').style.transform = scheduleOn?'translateX(16px)':'translateX(0)';
  document.getElementById('toggle-label').style.color = scheduleOn?'var(--brand2)':'var(--text4)';
}

function exportReport(){
  const btn = event.target;
  btn.textContent='Generating...';
  setTimeout(()=>{btn.textContent='Export PDF';alert('In a real app, this would download a PDF report. For your portfolio, screenshot the page and save it!');},1200);
}

renderAll();
</script>
</body>
</html>
